<svg width="1400" height="640" viewBox="0 0 1400 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">A brief history of artificial intelligence</title>
  <desc id="desc">A timeline showing major milestones in AI history from 1950 to 2022.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffaf1"/>
      <stop offset="100%" stop-color="#eef7ff"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="640" fill="url(#bg)"/>
  <text x="80" y="82" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#1f2f46">A Brief History of AI</text>
  <text x="80" y="118" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495a71">This timeline combines milestones highlighted in the local course materials with core developments widely recognised in AI.</text>

  <line x1="110" y1="330" x2="1290" y2="330" stroke="#577590" stroke-width="6" stroke-linecap="round"/>

  <circle cx="150" cy="330" r="14" fill="#577590"/>
  <rect x="90" y="185" width="120" height="110" rx="16" ry="16" fill="#ffffff" stroke="#577590" stroke-width="2"/>
  <text x="115" y="222" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2f46">1950</text>
  <text x="110" y="255" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495a71">Turing asks</text>
  <text x="110" y="278" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495a71">whether machines</text>
  <text x="110" y="301" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495a71">can think.</text>

  <circle cx="295" cy="330" r="14" fill="#43aa8b"/>
  <rect x="225" y="360" width="140" height="118" rx="16" ry="16" fill="#ffffff" stroke="#43aa8b" stroke-width="2"/>
  <text x="255" y="398" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1d4f45">1956</text>
  <text x="248" y="430" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#49796d">Dartmouth</text>
  <text x="248" y="453" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#49796d">Conference:</text>
  <text x="248" y="476" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#49796d">AI is named.</text>

  <circle cx="455" cy="330" r="14" fill="#f9a03f"/>
  <rect x="385" y="175" width="140" height="120" rx="16" ry="16" fill="#ffffff" stroke="#f9a03f" stroke-width="2"/>
  <text x="415" y="212" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#7a4b06">1958</text>
  <text x="408" y="244" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#90631c">Rosenblatt</text>
  <text x="408" y="267" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#90631c">introduces the</text>
  <text x="408" y="290" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#90631c">perceptron.</text>

  <circle cx="625" cy="330" r="14" fill="#bc6c25"/>
  <rect x="555" y="362" width="140" height="118" rx="16" ry="16" fill="#ffffff" stroke="#bc6c25" stroke-width="2"/>
  <text x="585" y="400" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#67380b">1986</text>
  <text x="578" y="432" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7c4e24">Backpropagation</text>
  <text x="578" y="455" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7c4e24">makes deeper</text>
  <text x="578" y="478" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7c4e24">training practical.</text>

  <circle cx="790" cy="330" r="14" fill="#6d597a"/>
  <rect x="720" y="175" width="140" height="120" rx="16" ry="16" fill="#ffffff" stroke="#6d597a" stroke-width="2"/>
  <text x="750" y="212" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#443050">1997</text>
  <text x="748" y="244" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5e4a69">Deep Blue</text>
  <text x="748" y="267" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5e4a69">defeats chess</text>
  <text x="748" y="290" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5e4a69">champion Kasparov.</text>

  <circle cx="940" cy="330" r="14" fill="#277da1"/>
  <rect x="870" y="362" width="140" height="118" rx="16" ry="16" fill="#ffffff" stroke="#277da1" stroke-width="2"/>
  <text x="900" y="400" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#174a61">2012</text>
  <text x="900" y="432" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2b6179">AlexNet wins</text>
  <text x="900" y="455" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2b6179">ImageNet and</text>
  <text x="900" y="478" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2b6179">reshapes vision.</text>

  <circle cx="1085" cy="330" r="14" fill="#c1121f"/>
  <rect x="1015" y="175" width="140" height="120" rx="16" ry="16" fill="#ffffff" stroke="#c1121f" stroke-width="2"/>
  <text x="1045" y="212" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#700b12">2017</text>
  <text x="1042" y="244" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8e2430">Transformer</text>
  <text x="1042" y="267" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8e2430">architecture</text>
  <text x="1042" y="290" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8e2430">is introduced.</text>

  <circle cx="1240" cy="330" r="14" fill="#2a9d8f"/>
  <rect x="1170" y="362" width="140" height="118" rx="16" ry="16" fill="#ffffff" stroke="#2a9d8f" stroke-width="2"/>
  <text x="1200" y="400" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#16534c">2022</text>
  <text x="1195" y="432" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#286860">ChatGPT brings</text>
  <text x="1195" y="455" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#286860">generative AI</text>
  <text x="1195" y="478" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#286860">into daily life.</text>

  <text x="80" y="560" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495a71">Common classroom summary:</text>
  <text x="350" y="560" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495a71">1. Symbolic AI and early optimism</text>
  <text x="690" y="560" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495a71">2. Expert systems and renewed interest</text>
  <text x="1045" y="560" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495a71">3. Deep learning era</text>
</svg>
