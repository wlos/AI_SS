<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI, machine learning, neural networks and deep learning</title>
  <desc id="desc">A nested diagram showing artificial intelligence containing machine learning, which contains neural networks, which contains deep learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5fbff"/>
      <stop offset="100%" stop-color="#eef7ec"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="80" y="90" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#143642">How AI, ML, Neural Networks and Deep Learning Fit Together</text>
  <text x="80" y="128" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#385864">Each inner area is a more specialised part of the area around it.</text>

  <rect x="80" y="170" rx="36" ry="36" width="1040" height="500" fill="#d9eef9" stroke="#246a8b" stroke-width="3"/>
  <text x="130" y="235" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#10384b">Artificial Intelligence</text>
  <text x="130" y="270" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#214c60">Systems designed to perform tasks that usually require human intelligence.</text>

  <rect x="170" y="290" rx="30" ry="30" width="860" height="320" fill="#dff4de" stroke="#3f8454" stroke-width="3"/>
  <text x="215" y="350" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#214e2d">Machine Learning</text>
  <text x="215" y="382" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#356243">Models that learn patterns from data instead of following only hand-written rules.</text>

  <rect x="280" y="410" rx="26" ry="26" width="620" height="150" fill="#fff3cf" stroke="#b78a17" stroke-width="3"/>
  <text x="320" y="465" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#6d5208">Neural Networks</text>
  <text x="320" y="497" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#7c651f">Layered models inspired loosely by how biological neurons pass signals.</text>

  <rect x="470" y="455" rx="22" ry="22" width="320" height="85" fill="#ffd9c7" stroke="#b65a2a" stroke-width="3"/>
  <text x="520" y="506" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#7e3310">Deep Learning</text>

  <rect x="860" y="188" rx="16" ry="16" width="220" height="112" fill="#ffffff" opacity="0.96"/>
  <text x="885" y="222" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#143642">AI examples</text>
  <text x="885" y="253" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#385864">Expert systems</text>
  <text x="885" y="278" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#385864">Robotics</text>
  <text x="885" y="303" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#385864">Planning and search</text>

  <rect x="785" y="316" rx="16" ry="16" width="250" height="115" fill="#ffffff" opacity="0.96"/>
  <text x="810" y="350" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#214e2d">ML examples</text>
  <text x="810" y="381" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#356243">Linear regression</text>
  <text x="810" y="406" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#356243">Decision trees</text>

  <rect x="120" y="470" rx="16" ry="16" width="210" height="108" fill="#ffffff" opacity="0.96"/>
  <text x="145" y="505" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#6d5208">NN examples</text>
  <text x="145" y="536" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#7c651f">Perceptrons</text>
  <text x="145" y="561" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#7c651f">Multilayer perceptrons</text>

  <rect x="830" y="460" rx="16" ry="16" width="220" height="108" fill="#ffffff" opacity="0.96"/>
  <text x="855" y="495" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#7e3310">DL examples</text>
  <text x="855" y="526" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#9a4b22">CNNs and Transformers</text>
  <text x="855" y="551" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#9a4b22">Large language models</text>

  <text x="80" y="715" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#385864">Key idea: not all AI uses machine learning, but most modern AI systems rely on machine learning, and deep learning is one of its most influential approaches.</text>
</svg>
