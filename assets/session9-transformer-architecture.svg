    <rect x="35" y="60" width="250" height="300" rx="24"/>
    <rect x="335" y="60" width="250" height="300" rx="24"/>
    <rect x="635" y="60" width="250" height="300" rx="24"/>
    <rect x="935" y="60" width="230" height="300" rx="24"/>
  </g>
  <path d="M291 201 H305 V191 L329 210 L305 229 V219 H291 Z M591 201 H605 V191 L629 210 L605 229 V219 H591 Z M891 201 H905 V191 L929 210 L905 229 V219 H891 Z" fill="#7c4db3" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>

  <g fill="#e9dafa" stroke="#7c4db3" stroke-width="3">
    <rect x="76" y="110" width="55" height="54" rx="9"/><rect x="145" y="110" width="55" height="54" rx="9"/><rect x="214" y="110" width="55" height="54" rx="9"/>
    <rect x="76" y="180" width="55" height="54" rx="9"/><rect x="145" y="180" width="55" height="54" rx="9"/><rect x="214" y="180" width="55" height="54" rx="9"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#633893" text-anchor="middle">
    <text x="104" y="145">t₁</text><text x="173" y="145">t₂</text><text x="242" y="145">t₃</text>
    <text x="104" y="215">p₁</text><text x="173" y="215">p₂</text><text x="242" y="215">p₃</text>
  </g>
  <g stroke="#ad80d0" stroke-width="4" fill="none">
    <path d="M390 126 L530 126 M390 126 L530 195 M390 126 L530 264 M390 195 L530 126 M390 195 L530 195 M390 195 L530 264 M390 264 L530 126 M390 264 L530 195 M390 264 L530 264"/>
  </g>
  <g fill="#7c4db3" stroke="#ffffff" stroke-width="3">
    <circle cx="390" cy="126" r="14"/><circle cx="390" cy="195" r="14"/><circle cx="390" cy="264" r="14"/>
    <circle cx="530" cy="126" r="14"/><circle cx="530" cy="195" r="14"/><circle cx="530" cy="264" r="14"/>
  </g>
  <g fill="#e9dafa" stroke="#7c4db3" stroke-width="3">
    <rect x="690" y="123" width="45" height="145" rx="10"/>
    <rect x="750" y="103" width="45" height="185" rx="10"/>
    <rect x="810" y="123" width="45" height="145" rx="10"/>
  </g>
  <g fill="#7c4db3"><rect x="983" y="115" width="35" height="170" rx="8"/><rect x="1035" y="153" width="35" height="132" rx="8"/><rect x="1087" y="190" width="35" height="95" rx="8"/></g>
