    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#172033" flood-opacity="0.13"/></filter>
  </defs>
  <rect width="1200" height="450" rx="26" fill="#faf6ff"/>
