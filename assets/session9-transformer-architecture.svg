<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title description">
  <title id="title">A simplified Transformer block</title>
  <desc id="description">Token representations with position information enter self-attention, where tokens exchange information, then a feed-forward block produces contextual representations for a task head.</desc>
