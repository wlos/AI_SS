<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">How a convolutional neural network builds visual features</title>
  <desc id="description">An image enters shared local convolution filters, repeated layers combine feature maps into higher-level features, and a task head produces a prediction.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#172033" flood-opacity="0.13"/></filter>
    <pattern id="pixels" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 H0 V32" fill="none" stroke="#9bb3ef" stroke-width="2"/></pattern>
  </defs>
  <rect width="1200" height="430" rx="26" fill="#f7f9ff"/>
  <g filter="url(#shadow)">
    <rect x="35" y="35" width="240" height="320" rx="22" fill="#ffffff" stroke="#9bb3ef" stroke-width="3"/>
    <rect x="330" y="35" width="240" height="320" rx="22" fill="#ffffff" stroke="#9bb3ef" stroke-width="3"/>
    <rect x="625" y="35" width="240" height="320" rx="22" fill="#ffffff" stroke="#9bb3ef" stroke-width="3"/>
    <rect x="920" y="35" width="240" height="320" rx="22" fill="#ffffff" stroke="#9bb3ef" stroke-width="3"/>
  </g>
  <path d="M281 182 H298 V172 L323 190 L298 208 V198 H281 Z M576 182 H593 V172 L618 190 L593 208 V198 H576 Z M871 182 H888 V172 L913 190 L888 208 V198 H871 Z" fill="#2457d6" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>

  <rect x="83" y="74" width="144" height="144" rx="10" fill="#dce8ff" stroke="#2457d6" stroke-width="3"/>
  <rect x="83" y="74" width="144" height="144" rx="10" fill="url(#pixels)"/>
  <rect x="115" y="106" width="64" height="64" fill="#2457d6" fill-opacity="0.30" stroke="#173b93" stroke-width="4"/>
  <text x="155" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#173b93">INPUT IMAGE</text>
  <text x="155" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5c6577">nearby pixels matter</text>

  <rect x="366" y="83" width="90" height="90" rx="8" fill="#e9efff" stroke="#2457d6" stroke-width="3"/>
  <path d="M396 83 V173 M426 83 V173 M366 113 H456 M366 143 H456" stroke="#9bb3ef" stroke-width="2"/>
  <path d="M382 158 L442 98" stroke="#2457d6" stroke-width="10" stroke-linecap="round"/>
  <rect x="452" y="137" width="72" height="72" rx="8" fill="#b5cbfa" stroke="#2457d6" stroke-width="3"/>
  <path d="M465 180 L483 161 L499 179 L513 153" fill="none" stroke="#173b93" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="450" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#173b93">CONVOLUTION</text>
  <text x="450" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5c6577">local, shared filters</text>

  <rect x="663" y="106" width="92" height="92" rx="8" fill="#dce8ff" stroke="#2457d6" stroke-width="3"/>
  <rect x="690" y="90" width="92" height="92" rx="8" fill="#b5cbfa" stroke="#2457d6" stroke-width="3"/>
  <rect x="718" y="74" width="92" height="92" rx="8" fill="#7399eb" stroke="#2457d6" stroke-width="3"/>
  <path d="M740 142 L761 105 L782 142" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="745" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#173b93">DEEPER LAYERS</text>
  <text x="745" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5c6577">parts and shapes</text>

  <g fill="#2457d6"><circle cx="970" cy="105" r="12"/><circle cx="970" cy="150" r="12"/><circle cx="970" cy="195" r="12"/></g>
  <g stroke="#7fa0e8" stroke-width="3"><path d="M982 105 L1050 120 M982 150 L1050 120 M982 150 L1050 180 M982 195 L1050 180"/></g>
  <g fill="#173b93"><circle cx="1060" cy="120" r="15"/><circle cx="1060" cy="180" r="15"/></g>
  <text x="1040" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#173b93">TASK HEAD</text>
  <text x="1040" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5c6577">class or location</text>
  <text x="600" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#5c6577">Repeated feature extraction builds a hierarchy; pooling may reduce spatial size.</text>
</svg>
