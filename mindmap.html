// Open mindmap content links in a new tab; resolve to online GitHub Pages if running from file://
document.addEventListener('click', function(e) {
  const link = e.target.closest('a');
  if (!link || !link.getAttribute('href') || link.classList.contains('nav-btn')) return;

  let href = link.getAttribute('href');
  
  if (window.location.protocol === 'file:' && !href.startsWith('http://') && !href.startsWith('https://')) {
    href = 'https://wlos.github.io/AI_SS/' + href.replace(/^\.\//, '');
    link.setAttribute('href', href);
  }

  link.setAttribute('target', '_blank');
  link.setAttribute('rel', 'noopener noreferrer');
});

// Recursive fold state manager for Markmap
function setNodeFold(node, fold, depth) {
  if (depth === undefined) depth = 0;
  if (depth >= 1) {
    node.payload = Object.assign({}, node.payload, { fold: fold ? 1 : 0 });
  } else {
    node.payload = Object.assign({}, node.payload, { fold: 0 });
  }
  if (node.children && node.children.length > 0) {
    node.children.forEach(function(child) {
      setNodeFold(child, fold, depth + 1);
    });
  }
}

document.addEventListener('DOMContentLoaded', function() {
  const btnZoomIn = document.getElementById('btn-zoom-in');
  const btnZoomOut = document.getElementById('btn-zoom-out');
  const btnFit = document.getElementById('btn-fit');
  const btnExpand = document.getElementById('btn-expand');
  const btnCollapse = document.getElementById('btn-collapse');

  if (btnZoomIn) {
    btnZoomIn.addEventListener('click', function() {
      if (markmapInstance) markmapInstance.rescale(1.25);
    });
  }

  if (btnZoomOut) {
    btnZoomOut.addEventListener('click', function() {
      if (markmapInstance) markmapInstance.rescale(0.8);
    });
  }

  if (btnFit) {
    btnFit.addEventListener('click', function() {
      if (markmapInstance) markmapInstance.fit();
    });
  }

  if (btnExpand) {
    btnExpand.addEventListener('click', async function() {
      if (markmapInstance && markmapInstance.state && markmapInstance.state.data) {
        setNodeFold(markmapInstance.state.data, false, 0);
        await markmapInstance.renderData();
        markmapInstance.fit();
      }
    });
  }

  if (btnCollapse) {
    btnCollapse.addEventListener('click', async function() {
      if (markmapInstance && markmapInstance.state && markmapInstance.state.data) {
        setNodeFold(markmapInstance.state.data, true, 0);
        await markmapInstance.renderData();
        markmapInstance.fit();
      }
    });
  }
});
</script>
</body>
</html>
